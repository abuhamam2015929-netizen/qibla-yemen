name: بناء تطبيق قبلة اليمن (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout الكود
        uses: actions/checkout@v4

      - name: تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: تثبيت Android SDK
        uses: android-actions/setup-android@v3

      - name: كتابة local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: بناء نسخة Debug APK (مع إعادة محاولة تلقائية حتى 3 مرات)
        run: |
          for i in 1 2 3; do
            echo "=== محاولة البناء رقم $i ==="
            if gradle assembleDebug --no-daemon --stacktrace; then
              echo "=== نجح البناء في المحاولة رقم $i ==="
              exit 0
            fi
            echo "=== فشلت المحاولة رقم $i، إعادة المحاولة بعد 15 ثانية... ==="
            sleep 15
          done
          echo "=== فشلت جميع المحاولات الثلاث ==="
          exit 1

      - name: رفع Debug APK كمخرجات (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: قبلة-اليمن-debug
          path: app/build/outputs/apk/debug/*.apk
